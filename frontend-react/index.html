<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BitMan" />
    <meta name="description" content="AI-powered market analysis dashboard" />
    <title>MarketFlow AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Capture beforeinstallprompt early before React mounts
      window.__pwaInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__pwaInstallPrompt = e;
      });

      // v3.1.0 — Service Worker 영구 제거 + 캐시 정리 (1회 자동 reload)
      (function() {
        var CACHE_VER = 'v3.1.0';
        var hadSW = false;
        if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
          hadSW = true;
        }
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            regs.forEach(function(r) { r.unregister(); });
          }).catch(function(){});
        }
        if ('caches' in window) {
          caches.keys().then(function(names) {
            names.forEach(function(name) { caches.delete(name); });
          }).catch(function(){});
        }
        // 기존 SW가 통제 중이었으면 1회만 강제 새로고침해서 깨끗한 상태로 진입
        if (hadSW && localStorage.getItem('cache_ver') !== CACHE_VER) {
          localStorage.setItem('cache_ver', CACHE_VER);
          setTimeout(function() { window.location.reload(); }, 100);
        } else {
          localStorage.setItem('cache_ver', CACHE_VER);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
