<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#d97706" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BitMan" />
    <meta name="description" content="AI-powered market analysis dashboard" />
    <title>MarketFlow AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />
    <!-- Kakao JavaScript SDK — 카카오톡 공유 (preload). init은 React 컴포넌트에서 VITE_KAKAO_JS_KEY 사용. -->
    <script defer src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js" crossorigin="anonymous"></script>
  </head>
  <body>
    <div id="root"></div>
    <div id="modal-root"></div>
    <script>
      // Capture beforeinstallprompt early before React mounts
      window.__pwaInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__pwaInstallPrompt = e;
      });

      // v4.0.1 — stale deployment cache recovery.
      // 과거 v3.1.0 kill-switch SW 사용자는 1회 unregister + cache 정리 후 신규 SW 등록.
      // 신규 유저는 바로 SW 등록 → 브라우저 install prompt 자동 발동.
      (function() {
        var CACHE_VER = 'v4.0.1';
        var prevVer = localStorage.getItem('cache_ver');
        var hadOldSW = 'serviceWorker' in navigator && !!navigator.serviceWorker.controller;

        function registerNewSW() {
          if (!('serviceWorker' in navigator)) return;
          navigator.serviceWorker.register('/sw.js')
            .then(function(reg) {
              // 업데이트 발견 시 자동으로 새 SW 로 교체
              reg.addEventListener('updatefound', function() {
                var nw = reg.installing;
                if (nw) nw.addEventListener('statechange', function() {
                  if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                    nw.postMessage({ type: 'SKIP_WAITING' });
                  }
                });
              });
            })
            .catch(function() { /* ignore */ });
        }

        if (prevVer !== CACHE_VER) {
          // Migration: 이전 SW (있다면) unregister + caches 비우기 → reload (있을 때만)
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              regs.forEach(function(r) { r.unregister(); });
            }).catch(function(){});
          }
          if ('caches' in window) {
            caches.keys().then(function(names) {
              names.forEach(function(name) { caches.delete(name); });
            }).catch(function(){});
          }
          localStorage.setItem('cache_ver', CACHE_VER);
          if (hadOldSW) {
            // 기존 SW 가 통제 중이었으면 1회 reload → 다음 로드에서 신규 SW 등록
            setTimeout(function() { window.location.reload(); }, 150);
            return;
          }
        }

        // 정상 경로: 신규 SW 등록 (PWA install prompt 활성화)
        if (document.readyState === 'complete') registerNewSW();
        else window.addEventListener('load', registerNewSW);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
