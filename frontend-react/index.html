    <script>
      // Capture beforeinstallprompt early before React mounts
      window.__pwaInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__pwaInstallPrompt = e;
      });

      // Keep one network-first service worker. Version the script URL so an
      // upstream cache cannot pin iOS home-screen users to an older worker.
      (function() {
        if (!('serviceWorker' in navigator)) return;

        function registerNewSW() {
          navigator.serviceWorker.register('/sw.js?v=4.2.0', { updateViaCache: 'none' })
            .then(function(reg) {
              reg.update().catch(function() {});
              reg.addEventListener('updatefound', function() {
                var nw = reg.installing;
                if (nw) nw.addEventListener('statechange', function() {
                  if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                    nw.postMessage({ type: 'SKIP_WAITING' });
                  }
                });
              });
            })
            .catch(function() { /* ignore */ });
        }

        if (document.readyState === 'complete') registerNewSW();
        else window.addEventListener('load', registerNewSW, { once: true });
      })();
    </script>
