    <!-- Kakao JavaScript SDK — 카카오톡 공유 (preload). init은 React 컴포넌트에서 VITE_KAKAO_JS_KEY 사용. -->
    <script defer src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js" crossorigin="anonymous"></script>
    <!-- Google AdSense — 게재 조건: public/ads.txt + robots.txt 의 Mediapartners-Google 허용이 함께 있어야 함 -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4268071335236139" crossorigin="anonymous"></script>
  </head>
  <body>
    <div id="root"></div>
    <div id="modal-root"></div>
    <script>
      // Capture beforeinstallprompt early before React mounts
      window.__pwaInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__pwaInstallPrompt = e;
      });

      // Keep one network-first service worker. Version the script URL so an
      // upstream cache cannot pin iOS home-screen users to an older worker.
      (function() {
        if (!('serviceWorker' in navigator)) return;

        function registerNewSW() {
          navigator.serviceWorker.register('/sw.js?v=4.2.0', { updateViaCache: 'none' })
            .then(function(reg) {
              reg.update().catch(function() {});
              reg.addEventListener('updatefound', function() {
                var nw = reg.installing;
                if (nw) nw.addEventListener('statechange', function() {
                  if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                    nw.postMessage({ type: 'SKIP_WAITING' });
                  }
                });
              });
            })
            .catch(function() { /* ignore */ });
        }

        if (document.readyState === 'complete') registerNewSW();
        else window.addEventListener('load', registerNewSW, { once: true });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
