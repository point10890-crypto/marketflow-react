<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#d97706" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BitMan" />
    <meta name="description" content="AI-powered market analysis dashboard" />
    <title>MarketFlow AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />
    <!-- Kakao JavaScript SDK — 카카오톡 공유 (preload). init은 React 컴포넌트에서 VITE_KAKAO_JS_KEY 사용. -->
    <script defer src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js" crossorigin="anonymous"></script>
  </head>
  <body>
    <div id="root"></div>
    <div id="modal-root"></div>
    <script>
      // Capture beforeinstallprompt early before React mounts
      window.__pwaInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__pwaInstallPrompt = e;
      });

      // Keep one network-first service worker. Version the script URL so an
      // upstream cache cannot pin iOS home-screen users to an older worker.
      (function() {
        if (!('serviceWorker' in navigator)) return;

        function registerNewSW() {
          navigator.serviceWorker.register('/sw.js?v=4.1.0', { updateViaCache: 'none' })
            .then(function(reg) {
              reg.update().catch(function() {});
              reg.addEventListener('updatefound', function() {
                var nw = reg.installing;
                if (nw) nw.addEventListener('statechange', function() {
                  if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                    nw.postMessage({ type: 'SKIP_WAITING' });
                  }
                });
              });
            })
            .catch(function() { /* ignore */ });
        }

        if (document.readyState === 'complete') registerNewSW();
        else window.addEventListener('load', registerNewSW, { once: true });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
