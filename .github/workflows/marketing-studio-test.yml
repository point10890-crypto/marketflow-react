name: marketing-studio

on:
  push:
    branches: [main]
    paths: ["marketing_studio/**", ".github/workflows/marketing-studio-test.yml"]
  pull_request:
    branches: [main]
    paths: ["marketing_studio/**", ".github/workflows/marketing-studio-test.yml"]

jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: marketing_studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: marketing_studio/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get install -y -qq fonts-nanum >/dev/null 2>&1 || true
      - name: Run pytest
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest -q
