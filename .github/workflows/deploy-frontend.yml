name: Deploy Frontend to Cloudflare Pages

on:
  # 자동 배포 비활성화 — 평시에는 로컬(miniPC) wrangler deploy로 통일.
  # 필요 시 Actions 탭에서 수동 실행 (workflow_dispatch).
  # push:
  #   branches: [main]
  #   paths:
  #     - 'frontend-react/**'
  #     - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:  # 수동 트리거만 허용

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-react

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (vite build + SEO prerender)
        run: npm run build
        # VITE_API_BASE_URL은 frontend-react/.env.production에서 관리

      # 로컬 `npm run deploy` 와 동일한 Cloudflare Pages 배포 명령.
      # (구 Workers `deploy` 명령은 wrangler.toml 의 pages_build_output_dir 와
      #  충돌해 실패하므로 pages deploy 로 교체 — 2026-08-27)
      - name: Deploy to Cloudflare Pages (bitman-marketflow)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          # main 에서 실행하면 프로덕션, 다른 브랜치에서 수동 실행하면 프리뷰 배포.
          # (--branch=main 하드코딩은 어떤 브랜치의 수동 실행도 프로덕션에 올렸다)
          command: pages deploy dist --project-name=bitman-marketflow --branch=${{ github.ref_name }}
          workingDirectory: frontend-react
